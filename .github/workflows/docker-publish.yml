name: Build & Push Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: |
        echo "${{ secrets.REG_TOKEN }}" \
          | docker login ghcr.io \
              --username "${{ secrets.REG_USER }}" \
              --password-stdin

    - name: Build Docker image
      run: |
        docker build \
          -t ghcr.io/${{ secrets.REG_USER }}/ml-btp:latest .

    - name: Push Docker image
      run: |
        docker push \
          ghcr.io/${{ secrets.REG_USER }}/ml-btp:latest
